<!DOCTYPE html>
<html>
<head><title>Admin Géant</title><meta charset="UTF-8"></head>
<body style="background:#111;color:#fff;padding:20px">
<h1>TOCONOU - LOGIN ADMIN</h1>
<input id="email" placeholder="Email" style="padding:10px;width:90%"><br><br>
<input id="pass" type="password" placeholder="Mot de passe" style="padding:10px;width:90%"><br><br>
<button onclick="login()" style="padding:10px;background:#00ff88">Se connecter Admin</button>
<p id="status"></p>
<div id="liste"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://wshpyuvzllzekuelcgpr.supabase.co','sb_publishable_w15TA0NjO2wElrnSz5Dp8Q_oRGsiFS_');
window.login = async()=>{
 const {data,error} = await supabase.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pass').value});
 if(error){document.getElementById('status').innerText=error.message;return;}
 if(data.user.email!=='favibaudouin56@gmail.com'){alert('Pas admin!');return;}
 document.getElementById('status').innerText='Admin: '+data.user.email;
 const {data:prof}=await supabase.from('profiles').select('*');
 document.getElementById('liste').innerHTML=prof.map(p=>`<p>${p.email} <button onclick="bloquer('${p.id}')">Bloquer</button></p>`).join('');
}
window.bloquer=async(id)=>{await supabase.from('profiles').update({est_bloque:true}).eq('id',id);alert('Bloqué');}
</script>
</body>
</html>
