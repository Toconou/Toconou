<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <meta name="mobile-web-app-capable" content="yes"> <title>TOCONOU</title> <style>body{margin:0;font-family:Arial;background:#eee;padding-bottom:80px}.card{background:white;margin:10px;padding:12px;border-radius:12px}.section{display:none}.section.active{display:block}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;gap:2px;padding:6px;border-top:3px solid #07C160}input,textarea,select,button{width:100%;padding:12px;margin:4px 0;border-radius:8px;border:1px solid #ccc}button{font-weight:900;border:none}.progress{background:#ddd;height:8px;border-radius:4px}#progressBar{background:#07C160;height:8px;width:0%}.badge{padding:2px 6px;border-radius:6px}.badge-non{background:#fdd}</style> <script src="https://cdn.fedapay.com/checkout.js"></script> </head> <body> <div style="background:#07C160;color:white;padding:12px;text-align:center;font-weight:900">TOCONOU - DECOUPE PRET</div> <div id="authBox" class="card" style="max-width:440px;margin:12px auto"> <select id="typeCompte"><option value="PERSONNEL">PERSONNEL tout faire</option><option value="PRO">PRO tout faire + vente</option></select> <input id="nom" placeholder="Nom"><input id="numero" placeholder="+229..."><input id="email" placeholder="Email"><input id="password" type="password" placeholder="MDP"><input id="ville" placeholder="Pays"><div id="recaptcha"></div> <button id="btnCreer" style="background:#07C160;color:white">Creer</button> <button id="btnLogin" style="background:black;color:white">Se connecter sur Toconou</button> <div style="text-align:right"><a id="btnOublieSide" style="font-size:11px;color:gray">Mot de passe oublie</a></div> <div id="authMsg" style="color:red;font-size:11px"></div> </div> <div id="app" style="display:none"> <div id="secChat" class="section active"><div class="card"><h3>Chat + Post+ TikTok</h3><input id="chatTo" placeholder="Email ami"><input id="chatMsg" placeholder="Message"><button id="btnChat" style="background:#07C160;color:white">Chat</button><button id="btnAITrans" style="background:black;color:white">TOCHE trad</button><div id="murChat" style="background:#f5f5f5;padding:6px;max-height:100px;overflow:auto"></div></div><div class="card"><select id="postType"><option value="PERSONNEL">Perso</option><option value="PAGE">Page PRO</option></select><textarea id="postText" placeholder="Texte long illimite..."></textarea><input type="file" id="postPhoto" multiple accept="image/*,video/*"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button id="btnRecVideo" style="background:red;color:white">Rec TikTok</button><button id="btnStopRec" style="background:black;color:white;display:none">Stop</button></div><video id="previewRec" style="width:100%;display:none;background:black;height:180px" controls></video><div style="font-size:10px">Texte <span id="countText">0 illimite</span> | Photos <span id="countPhotos">0</span> | Video <span id="countVideo">0</span> | Posts <span id="countPosts">0</span> | Chats <span id="countChats">0</span></div><button id="btnPost" style="background:#07C160;color:white">Publier Post+ like comment share</button><button id="btnAIDesc" style="background:black;color:yellow">TOCHE desc</button><div id="mur"></div></div></div> <div id="secContacts" class="section"><div class="card"><h3>Eligible + Monetisation + Booster</h3><span id="visiText" class="badge badge-non">NON</span> <span id="monetText" class="badge badge-non">NON MONETISE</span><div><span id="progressText">0%</span><div class="progress"><div id="progressBar"></div></div></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px"><button id="mGauche">gauche</button><button id="mDroite">droite</button><button id="mHaut">haut</button><button id="mBas">bas</button><button id="mCligne">cligne</button><button id="mBouche">bouche</button></div><button id="btnVerifPro" style="background:green;color:white">Verif visage</button><div>Booster <span id="boosterInfo">1x</span> <button id="btnBooster" style="background:orange;color:white">Booster 1000F FedaPay est la</button></div></div><div class="card"><button id="btnLogout" style="background:black;color:white">Deconnecter</button><button id="btnSupprimer" style="background:red;color:white">Supprimer</button></div></div> <div id="secDecouverte" class="section"><div class="card"><h3>Mini-Apps</h3><input id="legoNom" placeholder="Nom"><input id="legoEmoji" placeholder="Emoji"><select id="legoType"><option>E-com</option><option>Pay</option><option>Food</option><option>Mode</option></select><button id="btnLegoCreer" style="background:black;color:yellow">Creer mini-app PRO</button><div id="legoGrid" style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px"></div><div id="miniAppContainer" style="display:none;background:white;border:3px solid #07C160;height:300px;overflow:auto"><button id="btnFermerMini" style="width:auto;background:red;color:white">X</button><div id="miniAppContent"></div></div></div></div> <div id="secMarket" class="section"><div class="card"><h3>Marche % Cat Domaine FedaPay</h3><input id="prodNom" placeholder="Produit"><input id="prodCategorie" placeholder="Categorie"><input id="prodDomaine" placeholder="Domaine"><input id="prodPrix" type="number" placeholder="Prix"><input id="prodStock" type="number" placeholder="Stock"><select id="prodPays"><option>Benin 5%</option><option>Niger 8%</option><option>Mali 12%</option><option>Burkina 15%</option><option>Autre 22%</option></select><button id="btnProd" style="background:yellow">Creer produit PRO</button><div id="panierBox">Panier vide</div>Count <span id="panierCount">0</span><button id="btnCommander" style="background:blue;color:white">Payer FedaPay bloque</button><div id="suiviBox">Aucune commande</div><button id="btnEnvoyerColis" style="background:blue;color:white">Envoye</button><button id="btnRecuColis" style="background:green;color:white">Reçu</button><button id="btnDebloquer" style="background:gold">Debloquer + Facture</button><div id="factureBox" style="display:none;background:white;border:2px solid black;padding:8px"></div><input id="affilieCode" placeholder="Code BENIN500"><button id="btnAffilie" style="background:gold">Affiliation 10%</button><span id="affilieGain">0</span><button id="btnWorkflow" style="background:blue;color:white">Workflow Email+WhatsApp auto</button><div id="murCommande"></div></div></div> <div id="secMoi" class="section"><div class="card"><input id="docTitre" placeholder="Doc"><button id="btnDoc" style="background:blue;color:white">Doc PRO</button><button id="btnHistClient" style="background:blue;color:white">Hist CLIENT</button><button id="btnHistVendeur" style="background:black;color:white">Hist PRO</button><div id="histBox">Vide</div></div></div> <div class="tabs"><button id="tabChat" style="background:#07C160;color:white">Chat</button><button id="tabContacts">Contacts</button><button id="tabDecouverte">Decouverte</button><button id="tabMarket">Marche</button><button id="tabMoi">Moi</button></div> </div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {apiKey:"AIzaSyChHilkChFqr3dxzsLUHwipK4ZEfVKXjRI",authDomain:"toconou.firebaseapp.com",projectId:"toconou",storageBucket:"toconou.firebasestorage.app",messagingSenderId:"401451987705",appId:"1:401451987705:web:fd03c05ea33f9952422828"};
const appF=initializeApp(firebaseConfig);const auth=getAuth(appF);const db=getFirestore(appF);
const $=id=>document.getElementById(id);
if($('btnCreer'))$('btnCreer').onclick=async()=>{try{await createUserWithEmailAndPassword(auth,$('email').value,$('password').value);alert("MONDIAL cree!")}catch(e){$('authMsg').innerText=e.message}};
if($('btnLogin'))$('btnLogin').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){$('authMsg').innerText=e.message}};
if($('btnLogout'))$('btnLogout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if($('authBox'))$('authBox').style.display=u?'none':'block';if($('app'))$('app').style.display=u?'block':'none';if(u)start()});
function start(){
if($('btnPost'))$('btnPost').onclick=async()=>{if(!$('postText').value)return;await addDoc(collection(db,"posts"),{text:$('postText').value,email:auth.currentUser.email,createdAt:serverTimestamp()});$('postText').value="";};
if($('btnChat'))$('btnChat').onclick=async()=>{if(!$('chatTo').value||!$('chatMsg').value)return;await addDoc(collection(db,"chats"),{from:auth.currentUser.email,to:$('chatTo').value,msg:$('chatMsg').value,createdAt:serverTimestamp()});$('chatMsg').value="";};
if($('btnProd'))$('btnProd').onclick=async()=>{await addDoc(collection(db,"produits"),{nom:$('prodNom').value,prix:$('prodPrix').value,email:auth.currentUser.email,createdAt:serverTimestamp()});alert("Produit!");};
onSnapshot(query(collection(db,"posts"),orderBy("createdAt","desc")),s=>{if(!$('mur'))return;$('mur').innerHTML="";s.forEach(d=>{$('mur').innerHTML+=`<div style="background:#f5f5f5;margin:6px;padding:8px;border-radius:8px"><b>${d.data().email}</b><br>${d.data().text}<br><small>Monde</small></div>`})});
}
const tabs={tabChat:'secChat',tabContacts:'secContacts',tabDecouverte:'secDecouverte',tabMarket:'secMarket',tabMoi:'secMoi'};
Object.keys(tabs).forEach(t=>{if($(t))$(t).onclick=()=>{document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));if($(tabs[t]))$(tabs[t]).classList.add('active')}});
</script>
</body> </html>
